        @keyframes portal-glow {
            0%, 100% { box-shadow: 0 0 30px 10px rgba(139, 30, 45, 0.15), inset 0 0 20px rgba(139, 30, 45, 0.05); }
            50% { box-shadow: 0 0 50px 20px rgba(139, 30, 45, 0.3), inset 0 0 30px rgba(139, 30, 45, 0.15); }
        }

        .fantasy-portal-bg {
            position: relative;
            z-index: 1;
            animation: portal-glow 6s infinite;
        }
        .fantasy-portal-bg::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140%;
            height: 140%;
            background: radial-gradient(circle, rgba(139,30,45,0.1) 0%, rgba(11,11,12,0) 60%);
            z-index: -1;
            pointer-events: none;
        }

        @keyframes sway-bounce {
            0% { transform: translate(0px, 0px) rotate(-10deg) scale(1); }
            25% { transform: translate(10px, -15px) rotate(-5deg) scale(1.05); }
            50% { transform: translate(20px, 0px) rotate(0deg) scale(1); }
            75% { transform: translate(10px, 15px) rotate(-5deg) scale(0.95); }
            100% { transform: translate(0px, 0px) rotate(-10deg) scale(1); }
        }

        .portal-logo-anim {
            animation: sway-bounce 8s ease-in-out infinite;
            transform-origin: center;
        }
    </style>
